name: heat-task
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Keep conda to just Python + pip. The PyPI wheels (numpy, scipy, tables, …)
  # bundle their own native libs; extra conda libs land in Library\bin, which
  # Windows searches first — e.g. conda-forge's icuuc.dll shadows the system ICU
  # that PyQt6's Qt6Core.dll needs ("DLL load failed while importing QtCore").
  - pip:
      # pip reads pyproject.toml — the single source of truth for the package
      # and its PyPI dependencies. Use ".[dev]" instead of "." to include the
      # dev/test extras. Note: psychtoolbox is not declared in pyproject.toml
      # (no arm64 PyPI wheel); install the lab build manually — see the
      # Development Guide.
      - -e .
