[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heat-task"
version = "1.0.0-rc.6"
description = "Ramp-and-hold thermal pain task (PsychoPy) driven by a Medoc MMS thermode"
requires-python = ">=3.11,<3.12"
dependencies = [
    "psychopy>=2026.2",
    "psychtoolbox>=3.0.22",
    "psyexp-core>=0.9.0",
    "pydantic>=2",
    "rich>=15.0.0",
    "ruff>=0.15.4",
]
# psychtoolbox and psychopy move together. psychtoolbox 3.0.22 is the first release
# with an arm64 (universal2) wheel; older versions build from source on Apple Silicon
# and fail to import, which silently drops the keyboard to the weaker `event` backend.
# psychopy 2026.2 is the first release that doesn't cap psychtoolbox at <3.0.20 on
# non-arm64 or skip it on arm64. The lab wheel remains a backup: see docs/development.md.

[project.scripts]
heat-task = "heat_task.__main__:run"
medoc = "heat_task.medoc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/heat_task"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]  

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "Q"]

[tool.pytest.ini_options]
testpaths = ["tests"]
